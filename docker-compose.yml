services:
  backend:
    build:
      context: ./backend
    volumes:
      # The H2 file DB - never delete or recreate this volume to "fix" something (CLAUDE.md hard rule 1).
      - twlan_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8092:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  twlan_data:
