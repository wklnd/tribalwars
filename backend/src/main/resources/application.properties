spring.application.name=backend

# Persistent local file DB (single player, no server setup required)
spring.datasource.url=jdbc:h2:file:./data/twlan2;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

game.tick-rate-ms=1000

# Spring's scheduler has ONE thread by default, so the ~3 s NPC tick froze the 1 s game tick (finished buildings, trainings and
# arrivals were applied seconds late). Several threads let the game tick run on time while the NPCs think.
spring.task.scheduling.pool.size=4

# The browser polls the (large, repetitive) village list every 2.5 s: gzip it (remote play over Tailscale especially)
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# Lazy/eager many-to-one loads (Building -> Village -> Account ...) were one SELECT per row; load them in batches instead,
# and send inserts/updates of a transaction in batches
spring.jpa.properties.hibernate.default_batch_fetch_size=64
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
