server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Screen routing is client-side via location.hash (#overview, #building:HEADQUARTERS, ...), so the
    # server never sees more than "/" - this is just the normal static/SPA fallback.
    location / {
        try_files $uri /index.html;
    }

    # Same-origin API (src/api.js: BASE = "/api") - mirrors vite.config.js's dev proxy exactly, including
    # stripping Origin: the backend's CORS filter (WebConfig.java) only allows "http://localhost:5173" and
    # actively 403s any other Origin header, so it must be blanked or every POST/DELETE here would get
    # rejected in production the same way it would without vite's proxyReq.removeHeader('origin') in dev.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";

        # /api/events is a long-lived Server-Sent Events stream (see CLAUDE.md "Live updates"): buffering
        # would delay every event until nginx's buffer fills or the connection closes, and the default
        # proxy timeouts would kill it well before the client's own reconnect logic ever kicks in.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
